[package]
name = "presage-rn"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "presage_rn"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
presage = { git = "https://github.com/whisperfish/presage", rev = "c3d4dd56444e" }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "c3d4dd56444e" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-oslog = "0.2"
futures-util = "0.3"
futures-channel = "0.3"
hex = "0.4"
url = "2"
stacker = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime_guess = "2"
rusqlite = { version = "0.38", git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }
ringrtc = { path = "../ringrtc/src/rust", features = ["prebuilt_webrtc"] }
prost = "0.14"
anyhow = "1"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[patch.crates-io]
# signal-protocol uses a fork of this library via the patch mechanism of cargo.
# Since it is not transitive, we have to add the patch here explicitly.
"curve25519-dalek" = { git = 'https://github.com/signalapp/curve25519-dalek', tag = 'signal-curve25519-4.1.3' }
# presage-store-sqlite needs sqlcipher support from this fork
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }
# Vendored forks that relax the `hax-lib = "=0.3.5"` pin to ">=0.3.5" (and the
# matching hax-lib-macros-types pin) so presage's libsignal v0.87.4 can coexist
# with ringrtc's libsignal v0.89.2. The only change from the crates.io sources is
# the relaxed version requirement; see vendor/ for the full sources.
libcrux-ml-kem = { path = "vendor/libcrux-ml-kem" }
libcrux-intrinsics = { path = "vendor/libcrux-intrinsics" }
libcrux-sha3 = { path = "vendor/libcrux-sha3" }
libcrux-secrets = { path = "vendor/libcrux-secrets" }
core-models = { path = "vendor/core-models" }
