[package]
name = "test-provisioning"
version = "0.1.0"
edition = "2021"

[dependencies]
presage = { git = "https://github.com/whisperfish/presage", rev = "b575f2e83932e9d8bb29d281bc2ae2c93d9758f4" }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "b575f2e83932e9d8bb29d281bc2ae2c93d9758f4" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-channel = "0.3"
anyhow = "1"
url = "2"

[patch.crates-io]
"curve25519-dalek" = { git = 'https://github.com/signalapp/curve25519-dalek', tag = 'signal-curve25519-4.1.3' }
